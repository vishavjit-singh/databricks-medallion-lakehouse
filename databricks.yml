# Databricks Asset Bundle: deploys the three notebooks as one daily job (bronze → silver → gold).
#   databricks bundle validate
#   databricks bundle deploy -t dev
#   databricks bundle run medallion_daily -t dev --params batch_id=2026-11-01
# Requires a Unity Catalog workspace, a Volume for the landing zone and a secret scope with `pii-hash-salt`.
bundle:
  name: medallion-lakehouse

variables:
  catalog:
    default: main
  landing:
    default: /Volumes/main/landing/raw
  node_type:
    default: Standard_D4ds_v5

resources:
  jobs:
    medallion_daily:
      name: medallion-lakehouse-daily
      parameters:
        - name: batch_id
          default: "2026-11-01"
        - name: catalog
          default: ${var.catalog}
        - name: landing
          default: ${var.landing}
      job_clusters:
        - job_cluster_key: etl
          new_cluster:
            spark_version: 15.4.x-scala2.12
            node_type_id: ${var.node_type}
            num_workers: 1
            data_security_mode: SINGLE_USER
      tasks:
        - task_key: bronze_ingest
          job_cluster_key: etl
          notebook_task:
            notebook_path: ./notebooks/01_bronze_ingest.py
        - task_key: silver_quality
          depends_on:
            - task_key: bronze_ingest
          job_cluster_key: etl
          notebook_task:
            notebook_path: ./notebooks/02_silver_quality.py
        - task_key: gold_marts
          depends_on:
            - task_key: silver_quality
          job_cluster_key: etl
          notebook_task:
            notebook_path: ./notebooks/03_gold_marts.py

targets:
  dev:
    mode: development
    default: true
