name: Spark + Delta

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  parity:
    name: Spark + Delta engine matches the reference engine
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-spark.txt pytest
      - run: pytest -q -m spark tests/spark
      - name: Full demo through Spark + Delta
        run: make generate spark-demo

  compose:
    name: docker compose (both engines)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
      - name: Reference engine (generate → run → report)
        run: docker compose run --rm --no-deps local
      - name: Spark + Delta engine on the same landing files
        run: docker compose run --rm --no-deps spark
      - name: Delta tables were written
        run: test -d data/spark_lake/gold/dim_customer/_delta_log
